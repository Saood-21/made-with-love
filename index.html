<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Will you be my Valentine? 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght:400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff6ec4 0%, #7873f5 50%, #ff6ec4 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text y="20" font-size="20">💖</text></svg>') 12 12, auto;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        .retro-box {
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #ff1493;
            box-shadow: 
                0 0 0 10px #ffb6c1,
                0 0 0 15px #ff69b4,
                0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .game-section {
            position: relative;
            min-height: 400px;
        }
        
        .game-question {
            font-size: 3.5em;
            color: #ff1493;
            margin-bottom: 60px;
            font-weight: bold;
            text-shadow: 
                3px 3px 0 #ffb6c1,
                6px 6px 0 #ff69b4;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .game-buttons {
            position: relative;
            height: 250px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 20px 60px;
            font-size: 1.8em;
            font-family: 'Comic Neue', cursive;
            font-weight: bold;
            cursor: pointer;
            border: 4px solid;
            box-shadow: 6px 6px 0;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
        }
        
        .btn:hover {
            transform: translate(2px, 2px);
        }
        
        .btn-yes {
            background: linear-gradient(45deg, #00cc66, #00ff88);
            color: white;
            border-color: #009955;
            box-shadow: 6px 6px 0 #009955;
        }
        
        .btn-yes:hover {
            box-shadow: 4px 4px 0 #009955;
        }
        
        .btn-no {
            background: linear-gradient(45deg, #ff4444, #ff6666);
            color: white;
            border-color: #cc0000;
            box-shadow: 6px 6px 0 #cc0000;
            transition: all 0.15s ease;
        }
        
        .btn-no:hover {
            box-shadow: 4px 4px 0 #cc0000;
        }
        
        .victory-message {
            font-size: 3em;
            color: #00cc66;
            margin-top: 30px;
            animation: slideIn 0.5s ease-out;
            font-weight: bold;
            text-shadow: 3px 3px 0 rgba(0, 204, 102, 0.3);
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .hidden {
            display: none;
        }

        .no-sticker {
            position: fixed;
            pointer-events: none;
            z-index: 900;
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: stickerPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes stickerPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            60% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        
        .sparkle {
            position: fixed;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out forwards;
            z-index: 9998;
        }
        
        @keyframes sparkleFloat {
            0% { 
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .cursor-heart {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            animation: cursorFloat 2s ease-out forwards;
            z-index: 9999;
        }
        
        @keyframes cursorFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }
        
        /* Starfield */
        .star {
            position: fixed;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* Marquee Banner */
        .marquee-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
            color: white;
            padding: 10px 0;
            overflow: hidden;
            z-index: 999;
            border-bottom: 3px solid #c71585;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }
        
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        @keyframes scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <!-- Marquee Banner -->
    <div class="marquee-banner">
        <div class="marquee-content">
            💖 Happy Valentine's Day! 💖 You're the best! 💕 Love you so much! 💗 You make me smile! 💝 Forever and always! 💘 You're amazing! 💖
        </div>
    </div>
    <div class="container">
        <div class="retro-box">
            <div class="game-section">
                <div class="game-question" id="question">
                    Will you be my Valentine? 💝
                </div>
                <div class="game-buttons" id="gameButtons">
                    <button class="btn btn-yes" onclick="handleYes()">YES! 💖</button>
                    <button class="btn btn-no" id="noBtn">
                        No
                    </button>
                </div>
                <div class="victory-message hidden" id="victoryMsg">
                    YAY! I knew you'd say yes! 🎉💖✨
                </div>
            </div>
        </div>
    </div>

    <script>
        // Yes/No Game
        function handleYes() {
            document.getElementById('gameButtons').style.display = 'none';
            document.getElementById('question').style.display = 'none';
            document.getElementById('victoryMsg').classList.remove('hidden');
            document.querySelectorAll('.no-sticker').forEach(s => s.remove());
            createSparkles(40);
            
            // Tell background-music.js to start playing on the next page
            try {
                localStorage.setItem('bgMusicState', JSON.stringify({
                    playing: true, file: null, time: 0, timestamp: Date.now()
                }));
            } catch (e) {}

            // Redirect to welcome page after 2.5 seconds
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 2500);
        }
        
        // Sticker system
        let noCount = 0;
        const sticker1 = 'assets/stickers/normal baby.png';
        const sticker2 = 'assets/stickers/babyfire.png';

        function spawnSticker() {
            noCount++;
            const src = noCount <= 4 ? sticker1 : sticker2;

            const img = document.createElement('img');
            img.className = 'no-sticker';
            img.src = src;

            // Random position, keeping it within the viewport
            const size = 80 + Math.random() * 60; // 80-140px
            img.style.width = size + 'px';
            img.style.height = size + 'px';
            img.style.left = Math.random() * (window.innerWidth - size) + 'px';
            img.style.top = Math.random() * (window.innerHeight - size) + 'px';

            document.body.appendChild(img);
        }

        function moveNoButton(e) {
            if (e) e.preventDefault();
            const btn = document.getElementById('noBtn');
            const container = btn.parentElement;
            const yesBtn = document.querySelector('.btn-yes');

            const containerRect = container.getBoundingClientRect();
            const yesBtnRect = yesBtn.getBoundingClientRect();

            const btnW = btn.offsetWidth;
            const btnH = btn.offsetHeight;
            const maxX = containerRect.width - btnW - 10;
            const maxY = containerRect.height - btnH - 10;

            // Try random positions until we find one that doesn't overlap YES
            let randomX, randomY, tries = 0;
            do {
                randomX = Math.random() * maxX;
                randomY = Math.random() * maxY;

                // Check overlap with YES button (relative to container)
                const newLeft = containerRect.left + randomX;
                const newTop = containerRect.top + randomY;
                const overlaps =
                    newLeft < yesBtnRect.right + 20 &&
                    newLeft + btnW > yesBtnRect.left - 20 &&
                    newTop < yesBtnRect.bottom + 20 &&
                    newTop + btnH > yesBtnRect.top - 20;

                if (!overlaps || tries > 20) break;
                tries++;
            } while (true);

            btn.style.position = 'absolute';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';

            spawnSticker();
        }

        // Attach events — touchstart fires BEFORE click, preventing accidental YES
        (function () {
            const noBtn = document.getElementById('noBtn');
            noBtn.addEventListener('mouseover', moveNoButton);
            noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
            noBtn.addEventListener('click', function (e) {
                e.preventDefault();
                moveNoButton();
            });
        })();
        
        // Sparkles effect
        function createSparkles(count) {
            const sparkles = ['✨', '💖', '💕', '💗', '💝', '💘', '⭐', '🌟'];
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                    sparkle.style.left = Math.random() * window.innerWidth + 'px';
                    sparkle.style.top = window.innerHeight + 'px';
                    sparkle.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    sparkle.style.animationDelay = Math.random() * 2 + 's';
                    
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 3000);
                }, i * 50);
            }
        }
        
        // Cursor Trail
        let lastCursorTime = 0;
        
        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastCursorTime < 50) return;
            lastCursorTime = now;
            
            const hearts = ['💖', '💕', '💗', '💝', '💘', '❤️'];
            const heart = document.createElement('div');
            heart.className = 'cursor-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = e.pageX + 'px';
            heart.style.top = e.pageY + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 2000);
        });
        
        // Initial sparkles
        createSparkles(10);
        setInterval(() => createSparkles(3), 3000);
        
        // Create starfield
        function createStarfield() {
            const starCount = 50;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(star);
            }
        }
        
        createStarfield();
    </script>
</body>
</html>
