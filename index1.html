<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💘 Will You Be My Valentine? 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text y="20" font-size="20">💖</text></svg>'), auto;
        }

        body {
            font-family: 'Comic Neue', cursive;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ff6ec4 0%, #7873f5 50%, #ff6ec4 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Starfield Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Marquee */
        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4, #ff1493);
            border-bottom: 5px solid #fff;
            box-shadow: 0 4px 0 #ff1493, 0 8px 0 #fff, 0 12px 20px rgba(0,0,0,0.3);
            padding: 10px 0;
            z-index: 1000;
            overflow: hidden;
        }

        .marquee {
            display: flex;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #ff1493, 6px 6px 0 rgba(0,0,0,0.2);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .marquee span {
            padding: 0 50px;
        }

        /* Music Toggle */
        .music-toggle {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1001;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: 4px solid #fff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            box-shadow: 0 0 0 4px #ff1493, 0 6px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.3s;
        }

        .music-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 40px;
        }

        .question-box {
            background: linear-gradient(135deg, #ffe6f7 0%, #fff0fa 100%);
            border: 8px solid #ff1493;
            border-radius: 30px;
            box-shadow: 
                0 0 0 4px #fff,
                0 0 0 8px #ff69b4,
                0 20px 50px rgba(0,0,0,0.4);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: float 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .hearts-decoration {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: translateX(-50%) scale(1); }
            25% { transform: translateX(-50%) scale(1.2); }
            50% { transform: translateX(-50%) scale(1); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 48px;
            color: #ff1493;
            margin-bottom: 30px;
            text-shadow: 4px 4px 0 #fff, 8px 8px 0 #ff69b4;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 24px;
            color: #7873f5;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            padding: 20px 50px;
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 
                0 0 0 3px #000,
                0 8px 0 #000,
                0 12px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #fff;
            text-shadow: 2px 2px 0 #008844;
        }

        .btn-yes:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 0 0 3px #000,
                0 13px 0 #000,
                0 17px 40px rgba(0,0,0,0.4);
        }

        .btn-yes:active {
            transform: translateY(5px);
            box-shadow: 
                0 0 0 3px #000,
                0 3px 0 #000,
                0 5px 20px rgba(0,0,0,0.3);
        }

        .btn-no {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: #fff;
            text-shadow: 2px 2px 0 #cc0000;
            position: absolute;
        }

        .btn-no:hover {
            background: linear-gradient(135deg, #ff8888, #ff6b6b);
        }

        /* Victory Message */
        .victory {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 20, 147, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .victory-content {
            text-align: center;
            color: #fff;
        }

        .victory-content h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 80px;
            margin-bottom: 30px;
            animation: victoryBounce 0.6s ease-out;
            text-shadow: 5px 5px 0 rgba(0,0,0,0.3);
        }

        @keyframes victoryBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .victory-hearts {
            font-size: 100px;
            animation: heartExplode 1s ease-out;
        }

        @keyframes heartExplode {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        /* Floating Elements */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 4s ease-in infinite;
            font-size: 30px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Cursor Trail */
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 20px;
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.5);
            }
        }
    </style>
</head>
<body>
    <!-- Starfield -->
    <div class="stars" id="starfield"></div>

    <!-- Marquee -->
    <div class="marquee-container">
        <div class="marquee">
            <span>💖 Will You Be My Valentine? 💖</span>
            <span>💘 Click YES! 💘</span>
            <span>💝 You Know You Want To! 💝</span>
            <span>💗 Say YES! 💗</span>
            <span>💖 Will You Be My Valentine? 💖</span>
            <span>💘 Click YES! 💘</span>
            <span>💝 You Know You Want To! 💝</span>
            <span>💗 Say YES! 💗</span>
        </div>
    </div>

    <!-- Music Toggle -->
    <div class="music-toggle" id="musicToggle" title="Toggle Music">
        🎵
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="question-box">
            <div class="hearts-decoration">💕💖💕</div>
            <h1>Will You Be My Valentine?</h1>
            <p class="subtitle">✨ The most important question ever! ✨</p>
            <div class="buttons">
                <button class="btn btn-yes" onclick="handleYes()">YES! 💖</button>
                <button class="btn btn-no" id="noButton">NO 😢</button>
            </div>
        </div>
    </div>

    <!-- Victory Screen -->
    <div class="victory" id="victory">
        <div class="victory-content">
            <div class="victory-hearts">💖💘💝💗💕</div>
            <h2>YAAAY! 🎉</h2>
            <p style="font-size: 36px; margin-top: 20px;">I knew you'd say yes! 😊</p>
        </div>
    </div>

    <!-- Audio Element (Add your own MP3) -->
    <audio id="bgMusic"></audio>

    <script>
        // Create starfield
        function createStars() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        // Create floating hearts
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = ['💖', '💘', '💝', '💗', '💕'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '-50px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 4000);
        }

        // Cursor trail
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                const trail = document.createElement('div');
                trail.className = 'cursor-trail';
                trail.textContent = '💖';
                trail.style.left = e.pageX + 'px';
                trail.style.top = e.pageY + 'px';
                document.body.appendChild(trail);
                
                setTimeout(() => trail.remove(), 1000);
            }
        });

        // Escaping NO button
        const noButton = document.getElementById('noButton');
        let noButtonSpeed = 1;
        
        noButton.addEventListener('mouseenter', () => {
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 200) + 100;
            
            noButton.style.left = x + 'px';
            noButton.style.top = y + 'px';
            noButton.style.transition = `all ${0.3 / noButtonSpeed}s ease`;
            
            noButtonSpeed += 0.2;
            
            // Make the button text more desperate
            const messages = ['NO 😢', 'Wait! 😰', 'Please! 🥺', 'Come back! 😭', 'Nooo! 💔'];
            noButton.textContent = messages[Math.min(Math.floor(noButtonSpeed / 2), messages.length - 1)];
        });

        // YES button handler
        function handleYes() {
            const victory = document.getElementById('victory');
            victory.style.display = 'flex';
            
            // Create explosion of hearts
            for (let i = 0; i < 30; i++) {
                setTimeout(createFloatingHeart, i * 100);
            }
            
            // Redirect to welcome page after 3 seconds
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 3000);
        }

        // Initialize
        createStars();
        setInterval(createFloatingHeart, 2000);
    </script>
    <script src="assets/js/background-music.js"></script>
</body>
</html>
