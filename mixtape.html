<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Love Mixtape 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text y="20" font-size="20">💖</text></svg>'), auto;
        }

        body {
            font-family: 'Comic Neue', cursive;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ff5f9e 0%, #a17fe0 50%, #ff5f9e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #ff1493, #8b5cf6, #ff1493);
            border-bottom: 5px solid #fff;
            box-shadow: 0 4px 0 #ff1493, 0 8px 0 #fff, 0 12px 20px rgba(0,0,0,0.3);
            padding: 10px 0;
            z-index: 1000;
            overflow: hidden;
        }

        .marquee {
            display: flex;
            white-space: nowrap;
            animation: scroll 28s linear infinite;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #ff1493, 6px 6px 0 rgba(0,0,0,0.2);
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .marquee span {
            padding: 0 50px;
        }

        .music-toggle, .home-button {
            position: fixed;
            top: 80px;
            z-index: 1001;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: 4px solid #fff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            box-shadow: 0 0 0 4px #ff1493, 0 6px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.3s;
            text-decoration: none;
        }

        .music-toggle {
            right: 20px;
        }

        .home-button {
            right: 100px;
        }

        .music-toggle:hover, .home-button:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 120px 20px 60px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 52px;
            color: #ff1493;
            margin-bottom: 15px;
            text-shadow: 5px 5px 0 #fff, 10px 10px 0 #8b5cf6;
        }

        .page-header h1 .cd-icon {
            display: inline-block;
            animation: rotate 10s linear infinite;
            margin-left: 10px;
        }

        .page-header p {
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .mixtape-container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #ffe6f7 0%, #f5e6ff 100%);
            border: 10px solid #ff1493;
            border-radius: 25px;
            box-shadow: 
                0 0 0 6px #fff,
                0 0 0 12px #8b5cf6,
                0 0 0 15px #fff,
                0 20px 50px rgba(0,0,0,0.4);
            padding: 50px 40px;
            position: relative;
        }

        .spotify-barcode {
            text-align: center;
            margin-bottom: 30px;
        }

        .spotify-barcode img {
            max-width: 280px;
            width: 100%;
            border-radius: 10px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song {
            background: linear-gradient(135deg, #fff 0%, #ffd9f0 100%);
            border: 5px solid #ff69b4;
            border-radius: 15px;
            box-shadow: 
                0 0 0 3px #fff,
                0 0 0 6px #8b5cf6,
                0 8px 25px rgba(0,0,0,0.2);
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .song::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: left 0.5s;
        }

        .song:hover::before {
            left: 100%;
        }

        .song:hover {
            transform: translateX(10px);
            box-shadow: 
                0 0 0 3px #fff,
                0 0 0 6px #ff1493,
                0 12px 35px rgba(255,20,147,0.4);
        }

        .song.playing {
            border-color: #ff1493;
            background: linear-gradient(135deg, #fff0fa 0%, #ffe0f0 100%);
            box-shadow: 
                0 0 0 3px #fff,
                0 0 0 6px #ff1493,
                0 12px 35px rgba(255,20,147,0.4);
        }

        .song-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            float: left;
            margin-right: 20px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .song.playing .song-number {
            background: linear-gradient(135deg, #00cc66, #00ff88);
            font-size: 20px;
        }

        .song-info {
            overflow: hidden;
        }

        .song-title {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #ff1493;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #fff;
        }

        .song-artist {
            font-size: 20px;
            color: #8b5cf6;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .song-note {
            font-size: 18px;
            color: #666;
            font-style: italic;
            line-height: 1.5;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 105, 180, 0.2);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .song.playing .progress-bar-container {
            display: block;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        .song-duration {
            display: none;
            justify-content: space-between;
            font-size: 14px;
            color: #999;
            margin-top: 5px;
            font-weight: bold;
        }

        .song.playing .song-duration {
            display: flex;
        }

        .no-songs-message {
            text-align: center;
            padding: 40px;
            font-size: 22px;
            color: #ff1493;
            font-weight: bold;
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 4s ease-in infinite;
            font-size: 30px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 20px;
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px) scale(0.5); }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: sparkleAnim 2s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        .music-notes {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            font-size: 40px;
            animation: floatMusic 5s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes floatMusic {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
            50% { transform: translateY(-50px) translateX(30px) rotate(15deg); }
        }
    </style>
</head>

    <audio id="bgMusic"></audio>
    <audio id="songPlayer"></audio>

    <script>
        // ============================================================
        // 🎵 SONG CONFIGURATION - Add your songs here!
        // 
        // For each song, provide:
        //   file:   the MP3 filename in assets/music/
        //   title:  (optional) display title — if omitted, derived from filename
        //   artist: (optional) artist name
        //   note:   (optional) personal note about the song
        // ============================================================
        const songs = [
            { file: "Zaalima  Raees  Shah Rukh Khan  Arijit Singh & Harshdeep Kaur  JAM8  Pritam.mp3", title: "Zaalima", artist: "Arijit Singh & Harshdeep Kaur", note: "" },
            { file: "Taylor Swift - The Fate of Ophelia (Official Music Video).mp3", title: "The Fate of Ophelia", artist: "Taylor Swift", note: "" },
            { file: "Taylor Swift - Style.mp3", title: "Style", artist: "Taylor Swift", note: "" },
            { file: "Noor Mahal - Chani Nattan, Inderpal Moga (LyricsEnglish Meaning).mp3", title: "Noor Mahal", artist: "Chani Nattan, Inderpal Moga", note: "" },
            { file: "Lat Lag Gaye (Lyrics) - Benny Dayal & Shalmali Kholgade !.mp3", title: "Lat Lag Gaye", artist: "Benny Dayal & Shalmali Kholgade", note: "" },
            { file: "Karan Aujla, Ikky - For A Reason (Lyrics).mp3", title: "For A Reason", artist: "Karan Aujla, Ikky", note: "" },
            { file: "The Marías - Heavy (edit audio).mp3", title: "Heavy", artist: "The Marías", note: "" },
            { file: "The Marías - Jupiter.mp3", title: "Jupiter", artist: "The Marías", note: "" },
            { file: "Tujh Mein Rab Dikhta Hai Song  Rab Ne Bana Di Jodi  Shah Rukh Khan, Anushka Sharma  Roop Kumar.mp3", title: "Tujh Mein Rab Dikhta Hai", artist: "Roop Kumar Rathod", note: "" },
            { file: "Aaj Kal Tere Mere Pyar Ke Charche  Brahmachari (1968)  Shammi Kapoor  Mumtaz  Pran  Hindi Song.mp3", title: "Aaj Kal Tere Mere Pyar Ke Charche", artist: "Shammi Kapoor", note: "" },
            { file: "Main Tere pai mar gayi Sajnare Black Screen Lyrics Video.mp3", title: "Main Tere Pai Mar Gayi Sajnare", artist: "", note: "" },
            { file: "Ravyn Lenae - Love Me Not (Lyrics).mp3", title: "Love Me Not", artist: "Ravyn Lenae", note: "" },
            { file: "Mere Kaan Mai Hai Jo Bali  Kithe Reh Gaya (lyrical Video)  Neeti Mohan.mp3", title: "Kithe Reh Gaya", artist: "Neeti Mohan", note: "" },
            { file: "Jimmy pulls up in his blue Chevy Nova - Lana Del Rey #lanadelreylove.mp3", title: "Jimmy Pulls Up In His Blue Chevy Nova", artist: "Lana Del Rey", note: "" },
            { file: "The Chainsmokers - Closer (Lyrics) ft. Halsey.mp3", title: "Closer", artist: "The Chainsmokers ft. Halsey", note: "" },
            { file: "Aaj Din Chadheya -lyrics  Rahat Fateh Ali Khan  Love Aaj Kal @LYRICS.mp3", title: "Aaj Din Chadheya", artist: "Rahat Fateh Ali Khan", note: "" },
            { file: "Sanun Nahar Wale Pul  @EMIPakistanOfficial Madam Noor Jehan.mp3", title: "Sanun Nahar Wale Pul", artist: "Madam Noor Jehan", note: "" },
            { file: "ve kamleya - edit audio.mp3", title: "Ve Kamleya", artist: "", note: "" },
            { file: "rab jane menu ho gaya ki ve tere bina mera lagda  Slowed Reverb  DO PALL SURINDER KAUR X COACHSAH.mp3", title: "Do Pall", artist: "Surinder Kaur", note: "" },
            { file: "Ranjha  Official Video  Shershaah  SidharthKiara  B Praak  Jasleen Royal  Romy  Anvita Dutt.mp3", title: "Ranjha", artist: "B Praak & Jasleen Royal", note: "" },
            { file: "Tere Liye - Atif Aslam & Shreya Ghoshal (Lyrics)  Lyrical Bam Hindi.mp3", title: "Tere Liye", artist: "Atif Aslam & Shreya Ghoshal", note: "" },
            { file: "kangana tera ni (sped up).mp3", title: "Kangana Tera Ni", artist: "", note: "" },
            { file: "Jawani Jan-E-Man House Trap.mp3", title: "Jawani Jan-E-Man", artist: "", note: "" },
            { file: "Tesher - Jalebi Baby (Original Version) (Official Lyric Video).mp3", title: "Jalebi Baby", artist: "Tesher", note: "" },
            { file: "KASHISH (Lyrics) Ashish Bhatia  Kashish Ratnani  Omkar Singh.mp3", title: "Kashish", artist: "Ashish Bhatia", note: "" },
            { file: "main tera.mp3", title: "Main Tera", artist: "", note: "" },
            { file: "Taylor Swift - Wildest Dreams (Lyrics).mp3", title: "Wildest Dreams", artist: "Taylor Swift", note: "" },
            { file: "Agora Hills.mp3", title: "Agora Hills", artist: "", note: "" },
            { file: "Meem Se Mohabbat -Beqarrar Yeh Dil  - Singers [ Asim Azhar & Qirat Haider ] - HUM TV.mp3", title: "Meem Se Mohabbat", artist: "Asim Azhar & Qirat Haider", note: "" },
        ];

        // ============================================================
        // Player logic — no need to edit below this line
        // ============================================================
        const audioPlayer = document.getElementById('songPlayer');
        let currentlyPlayingIndex = -1;
        let progressInterval = null;
        let bgWasPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function titleFromFilename(filename) {
            return filename
                .replace(/\.mp3$/i, '')
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        function renderSongs() {
            const songList = document.getElementById('songList');
            songList.innerHTML = '';

            if (songs.length === 0) {
                songList.innerHTML = '<div class="no-songs-message">No songs added yet!<br>Edit the <code>songs</code> array in this file to add your MP3s 🎶</div>';
                return;
            }

            songs.forEach((song, index) => {
                const title = song.title || titleFromFilename(song.file);
                const artist = song.artist || '';
                const note = song.note || '';

                const div = document.createElement('div');
                div.className = 'song';
                div.setAttribute('data-index', index);
                div.onclick = () => toggleSong(index);

                div.innerHTML = `
                    <div class="song-number" id="songNum${index}">${index + 1}</div>
                    <div class="song-info">
                        <div class="song-title">${title}</div>
                        ${artist ? `<div class="song-artist">${artist}</div>` : ''}
                        ${note ? `<div class="song-note">${note}</div>` : ''}
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="progress${index}"></div>
                        </div>
                        <div class="song-duration">
                            <span id="currentTime${index}">0:00</span>
                            <span id="totalTime${index}">0:00</span>
                        </div>
                    </div>
                `;

                songList.appendChild(div);
            });
        }

        function pauseBackgroundMusic() {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic && !bgMusic.paused) {
                bgWasPlaying = true;
                bgMusic.pause();
            }
        }

        function resumeBackgroundMusic() {
            if (bgWasPlaying) {
                const bgMusic = document.getElementById('bgMusic');
                if (bgMusic) bgMusic.play().catch(() => {});
                bgWasPlaying = false;
            }
        }

        function stopCurrentSong() {
            if (currentlyPlayingIndex >= 0) {
                const prevCard = document.querySelector(`.song[data-index="${currentlyPlayingIndex}"]`);
                if (prevCard) prevCard.classList.remove('playing');
                const prevNum = document.getElementById(`songNum${currentlyPlayingIndex}`);
                if (prevNum) prevNum.textContent = currentlyPlayingIndex + 1;
            }
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            clearInterval(progressInterval);
            currentlyPlayingIndex = -1;
        }

        function updateProgress() {
            if (currentlyPlayingIndex < 0) return;
            const bar = document.getElementById(`progress${currentlyPlayingIndex}`);
            const cur = document.getElementById(`currentTime${currentlyPlayingIndex}`);
            const tot = document.getElementById(`totalTime${currentlyPlayingIndex}`);
            if (bar) {
                const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                bar.style.width = pct + '%';
            }
            if (cur) cur.textContent = formatTime(audioPlayer.currentTime);
            if (tot) tot.textContent = formatTime(audioPlayer.duration);
        }

        function toggleSong(index) {
            if (currentlyPlayingIndex === index) {
                // Toggle pause/play on the same song
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    document.getElementById(`songNum${index}`).textContent = '⏸';
                    progressInterval = setInterval(updateProgress, 300);
                } else {
                    audioPlayer.pause();
                    document.getElementById(`songNum${index}`).textContent = '▶';
                    clearInterval(progressInterval);
                }
                return;
            }

            // Stop the previous song
            stopCurrentSong();

            // Pause background music when playing a song from the list
            pauseBackgroundMusic();

            // Play the new song
            currentlyPlayingIndex = index;
            const song = songs[index];
            audioPlayer.src = 'assets/music/' + encodeURIComponent(song.file);
            audioPlayer.loop = false;
            audioPlayer.play();

            const card = document.querySelector(`.song[data-index="${index}"]`);
            if (card) card.classList.add('playing');
            document.getElementById(`songNum${index}`).textContent = '⏸';

            progressInterval = setInterval(updateProgress, 300);
        }

        // When a song ends, play the next one or resume background music
        audioPlayer.addEventListener('ended', () => {
            const nextIndex = currentlyPlayingIndex + 1;
            stopCurrentSong();
            if (nextIndex < songs.length) {
                toggleSong(nextIndex);
            } else {
                // No more songs in the list — resume background music
                resumeBackgroundMusic();
            }
        });

        // Visual effects
        function createStars() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = ['💖', '💘', '💝', '💗', '💕', '🎵', '🎶'][Math.floor(Math.random() * 7)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '-50px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function createMusicNote() {
            const note = document.createElement('div');
            note.className = 'music-notes';
            note.textContent = ['🎵', '🎶', '🎼'][Math.floor(Math.random() * 3)];
            note.style.left = Math.random() * 100 + '%';
            note.style.top = Math.random() * 100 + '%';
            note.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(note);
        }

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 2000);
        }

        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                const trail = document.createElement('div');
                trail.className = 'cursor-trail';
                trail.textContent = '💖';
                trail.style.left = e.pageX + 'px';
                trail.style.top = e.pageY + 'px';
                document.body.appendChild(trail);
                setTimeout(() => trail.remove(), 1000);
            }
            if (Math.random() > 0.95) {
                createSparkle(e.pageX, e.pageY);
            }
        });

        // Initialize
        createStars();
        renderSongs();
        for (let i = 0; i < 5; i++) {
            createMusicNote();
        }
        setInterval(createFloatingHeart, 2000);
    </script>
    <script src="assets/js/background-music.js"></script>
    <script>
        // Sync the currently-playing mixtape song into the background-music
        // state so it persists as bg music when navigating to other pages.
        (function () {
            const sp = document.getElementById('songPlayer');

            function syncMixtapeState() {
                if (currentlyPlayingIndex >= 0 && !sp.paused && songs[currentlyPlayingIndex]) {
                    const state = {
                        playing: true,
                        file: songs[currentlyPlayingIndex].file,
                        time: sp.currentTime || 0,
                        timestamp: Date.now()
                    };
                    try { localStorage.setItem('bgMusicState', JSON.stringify(state)); } catch (e) {}
                }
            }

            // Periodic sync while a mixtape song is playing
            setInterval(syncMixtapeState, 1000);

            // Final sync on page leave — runs AFTER background-music.js's handler
            window.addEventListener('beforeunload', syncMixtapeState);
        })();
    </script>
</body>
</html>
